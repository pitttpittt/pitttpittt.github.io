name: Extraire le site
on:
  push:
    branches: [main]
    paths: ['_bundle/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: extract
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract bundle
        run: |
          if [ -d _bundle ]; then
            cat _bundle/part* | base64 -d > /tmp/site.tgz
            tar xzf /tmp/site.tgz -C .
            git rm -rq _bundle
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Publication du site" || exit 0
            git push
          fi
